<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34452f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moje stylistka">
<link rel="manifest" href="manifest.webmanifest">
<title>Moje stylistka</title>
<style>
:root{--green:#34452f;--olive:#66724a;--ochre:#bd8a32;--cream:#f7f1e7;--paper:#fffdf8;--ink:#302f27;--muted:#777365;--line:#e6ddcd;--rose:#b88e80}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;min-height:100dvh;padding-bottom:88px}.top{background:var(--green);color:#fff9ed;padding:22px 20px 18px;border-radius:0 0 26px 26px}.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:.2px}.tag{font-size:12px;opacity:.8;margin-top:4px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border:1px solid #ffffff55;border-radius:999px;padding:7px 11px;font-size:12px}.content{padding:18px 16px}.welcome{font:24px Georgia,serif;margin:4px 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.45}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffdf8f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px max(8px,env(safe-area-inset-bottom));gap:2px}.tabs button{flex:1;max-width:150px;background:none;border:0;color:#777365;font-size:11px;padding:7px 2px;border-radius:13px}.tabs button span{display:block;font-size:20px;margin-bottom:3px}.tabs button.active{background:#e9eadf;color:var(--green);font-weight:700}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.sectionhead h2{font:22px Georgia,serif;margin:0}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#fffdf5;font-weight:650}.btn.secondary{background:#e8e5d8;color:var(--green)}.btn.ochre{background:var(--ochre);color:#fff}.btn.small{padding:8px 11px;font-size:13px}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.stack{display:grid;gap:11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 3px 12px #453a2110}.hero-card{background:linear-gradient(135deg,#e8e7d8,#f9e9d1);border-radius:22px;padding:18px;position:relative;overflow:hidden}.hero-card:after{content:"✿";position:absolute;right:10px;top:-25px;font-size:110px;color:#9b9c7850}.hero-card>*{position:relative;z-index:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{overflow:hidden;padding:0}.item img{width:100%;aspect-ratio:4/4.6;object-fit:cover;background:#eee6d9;display:block}.item .meta{padding:10px}.item strong{display:block;font-size:14px}.item small{color:var(--muted);display:block;margin-top:4px}.itemactions{display:flex;gap:6px;margin-top:9px}.itemactions button{flex:1}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fffdf8;padding:12px;color:var(--ink)}.field input[type=file]{padding:9px;font-size:13px}.field textarea{min-height:75px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.notice{font-size:12px;color:var(--muted);line-height:1.5;background:#efeadf;border-radius:12px;padding:11px}.empty{text-align:center;padding:30px 18px;color:var(--muted)}.empty .flower{font-size:35px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{border:1px solid var(--line);border-radius:999px;background:#fffdf8;padding:8px 11px;font-size:12px;color:var(--ink)}.chip.selected{background:var(--green);color:#fff;border-color:var(--green)}.outfit-look{display:grid;grid-template-columns:1fr 1fr;gap:8px}.outfit-look img{width:100%;aspect-ratio:1/1.1;object-fit:cover;border-radius:12px;background:#eee6d9}.outfit-look .wide{grid-column:span 2}.saved-outfit{display:flex;gap:10px;align-items:center}.saved-outfit img{width:70px;height:80px;object-fit:cover;border-radius:10px}.saved-outfit .grow{flex:1}.profilepreview{width:100%;max-height:330px;object-fit:contain;background:#eee6d9;border-radius:16px}.hidden{display:none!important}.footer-note{text-align:center;font-size:11px;color:var(--muted);padding:20px 5px}.modal-back{position:fixed;z-index:30;inset:0;background:#1f251dc9;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:var(--cream);width:100%;max-width:650px;max-height:94dvh;overflow:auto;border-radius:24px 24px 16px 16px;padding:20px}.modal h2{font:24px Georgia,serif;margin:0 0 12px}.close-row{display:flex;justify-content:space-between;align-items:center}.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;border:1px solid #0001}.status{font-size:12px;color:var(--olive);min-height:18px;margin-top:8px}.filelabel{display:block;border:1px dashed #aaa68f;border-radius:15px;padding:15px;text-align:center;background:#faf6ed;color:var(--green)}@media(min-width:600px){.content{padding:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top{margin-top:14px;border-radius:26px}.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(780px,100%);border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="brand">✿ Moje stylistka</div><div class="tag">Tvoje oblečení. Tvůj styl. Tvoje malé módní kouzlo.</div></div><span class="pill">♡ bez reklam</span></div></header>
<main id="view" class="content"></main>
<nav class="tabs">
<button data-tab="home" class="active"><span>⌂</span>Domů</button>
<button data-tab="wardrobe"><span>♧</span>Šatník</button>
<button data-tab="stylist"><span>✧</span>Stylistka</button>
<button data-tab="favorites"><span>♡</span>Oblíbené</button>
<button data-tab="profile"><span>☼</span>Profil</button>
</nav>
</div>
<div id="modalroot"></div>
<script>
const DB_NAME='moje-stylistka-db', STORE='records';
let db, currentTab='home', wardrobe=[], outfits=[], profile=null, selectedItems=[], editingItem=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(v){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function del(id){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function imgURL(blob){return URL.createObjectURL(blob)}
function itemById(id){return wardrobe.find(x=>x.id===id)}
function nav(tab){currentTab=tab;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function button(label,action,cls='btn small'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function cardItem(i){return `<article class="card item"><img src="${imgURL(i.image)}" alt="${esc(i.name)}"><div class="meta"><strong>${esc(i.name)}</strong><small>${esc(i.category)} · ${esc(i.color||'barva neuvedena')}</small><div class="itemactions">${button('Upravit','edit:'+i.id,'btn secondary small')}${button(i.favorite?'♥':'♡','favitem:'+i.id,'btn ghost small')}</div></div></article>`}
function renderHome(){return `<div class="welcome">Ahoj, vítej ve svém šatníku 🌿</div><p class="sub">Najdeme nové kombinace z věcí, které už máš. Bez reklam a bez předplatného.</p><div class="hero-card"><h2 style="font:25px Georgia,serif;margin:0 0 8px">Co si dnes obléct?</h2><p style="max-width:80%;font-size:14px;line-height:1.5">Vyber příležitost a stylistka navrhne kombinace z tvého šatníku.</p>${button('Vytvořit outfit','goto:stylist','btn')}</div><div class="sectionhead"><h2>Můj šatník</h2>${button('＋ Přidat kousek','add','btn secondary small')}</div><div class="grid">${wardrobe.slice(-4).reverse().map(cardItem).join('')||`<div class="card empty" style="grid-column:1/-1"><div class="flower">♧</div><b>Tvůj šatník čeká na první kousek</b><p>Vyfoť třeba oblíbený svetr a začni.</p>${button('Přidat oblečení','add','btn')}</div>`}</div><div class="sectionhead"><h2>Nedávné outfity</h2></div>${outfits.slice().reverse().slice(0,2).map(o=>`<div class="card saved-outfit"><div class="grow"><b>${esc(o.title)}</b><div class="sub">${o.itemIds.length} kousků</div></div>${button('Otevřít','viewoutfit:'+o.id,'btn secondary small')}</div>`).join('')||`<div class="card sub">Až si uložíš první kombinaci, najdeš ji tady.</div>`}`}
function renderWardrobe(){return `<div class="sectionhead" style="margin-top:4px"><h2>Můj šatník</h2>${button('＋ Přidat','add','btn')}</div><p class="sub">Každý kus vyfoť zvlášť. Fotografie zůstávají uložené v tomto zařízení.</p><div class="chips">${['Vše','Vrchní díly','Kalhoty a sukně','Šaty','Boty','Doplňky','Svrchní oblečení'].map(c=>`<button class="chip ${filterCat===c?'selected':''}" data-action="filter:${c}">${c}</button>`).join('')}</div><div class="grid">${wardrobe.filter(i=>filterCat==='Vše'||i.category===filterCat).slice().reverse().map(cardItem).join('')||`<div class="card empty" style="grid-column:1/-1"><div class="flower">✿</div><b>Zatím tu nic není</b><p>Přidej první kousek oblečení.</p>${button('Vyfotit oblečení','add','btn')}</div>`}</div>`}
function renderStylist(){return `<div class="welcome">Tvoje AI stylistka ✨</div><p class="sub">Vyber příležitost a kousky, ze kterých chceš kombinovat. První verze používá lokální pravidla – není potřeba platit za AI službu.</p><div class="card"><div class="field"><label>Kam se chystáš?</label><div class="chips">${['Do práce','Volný čas','Na procházku','Na rande','Na výlet','Na doma'].map(c=>`<button class="chip ${occasion===c?'selected':''}" data-action="occasion:${c}">${c}</button>`).join('')}</div></div><div class="field"><label>Počasí / nálada (nepovinné)</label><select id="weather"><option>Vyber...</option><option>Chladno – chci vrstvit</option><option>Teplo</option><option>Déšť</option><option>Chci něco elegantního</option><option>Chci pohodlí</option></select></div><div class="field"><label>Vyber kousky, které chceš zahrnout (nepovinné)</label><div class="chips">${wardrobe.map(i=>`<button class="chip ${selectedItems.includes(i.id)?'selected':''}" data-action="pick:${i.id}">${esc(i.name)}</button>`).join('')||'Nejdřív přidej oblečení do šatníku.'}</div></div>${button('Navrhnout kombinace','generate','btn')}</div><div id="suggestions">${suggestionsHTML()}</div><div class="notice">Poznámka: tato první verze sama nevytváří realistické převlečení na fotografii. Umí uložit tvoji profilovou fotku a ukázat vybrané kousky vedle sebe. Realistické AI převlékání vyžaduje další technologii, kterou zatím nelze zaručit zdarma a pouze v telefonu.</div>`}
function suggestionsHTML(){if(!suggestions.length)return '';return `<div class="sectionhead"><h2>Návrhy pro tebe</h2></div><div class="stack">${suggestions.map((s,n)=>`<div class="card"><div class="sectionhead" style="margin:0 0 10px"><h2 style="font-size:19px">Kombinace ${n+1}</h2><span class="pill" style="color:var(--green);border-color:var(--line)">${s.items.length} kousků</span></div><div class="outfit-look">${s.items.map(i=>`<img src="${imgURL(i.image)}" alt="${esc(i.name)}">`).join('')}</div><p class="sub">${esc(s.reason)}</p><div class="row">${button('Uložit outfit','saveoutfit:'+n,'btn')}${button('Co dokoupit?','shopping:'+n,'btn secondary')}</div></div>`).join('')}</div>`}
function renderFavorites(){const fav=outfits.filter(o=>o.favorite);return `<div class="welcome">Moje oblíbené ♡</div><p class="sub">Outfity, ke kterým se chceš vracet.</p><div class="stack">${fav.map(o=>`<div class="card saved-outfit"><div class="grow"><b>${esc(o.title)}</b><div class="sub">${o.itemIds.length} kousků</div></div>${button('Zobrazit','viewoutfit:'+o.id,'btn secondary small')}${button('♥','unfav:'+o.id,'btn ghost small')}</div>`).join('')||`<div class="card empty"><div class="flower">♡</div><b>Zatím nemáš oblíbené outfity</b><p>Vytvoř kombinaci a ulož si ji.</p>${button('Navrhnout outfit','goto:stylist','btn')}</div>`}</div>`}
function renderProfile(){return `<div class="welcome">Můj profil</div><p class="sub">Nastav si profil pro osobnější doporučení. Fotografie zůstává pouze v tomto zařízení.</p><div class="card"><div class="field"><label>Fotografie postavy (volitelné)</label><label class="filelabel">＋ Vybrat fotografii<input id="profilefile" type="file" accept="image/*" capture="user" style="display:none"></label></div>${profile?.image?`<img class="profilepreview" src="${imgURL(profile.image)}" alt="Tvoje profilová fotografie">`:''}<div class="field"><label>Jaký styl máš ráda?</label><select id="style"><option>Romantický a přirozený</option><option>Elegantní</option><option>Pohodlný a ležérní</option><option>Minimalistický</option><option>Výrazný a kreativní</option></select></div><div class="field"><label>Oblíbené barvy</label><div class="chips"><span class="chip"><i class="swatch" style="background:#66724a"></i>Olivová</span><span class="chip"><i class="swatch" style="background:#34452f"></i>Tmavě zelená</span><span class="chip"><i class="swatch" style="background:#bd8a32"></i>Okrová</span><span class="chip"><i class="swatch" style="background:#f3e8d4"></i>Krémová</span></div></div>${button('Uložit preference','saveprofile','btn')}</div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">Soukromí a data</h3><p class="sub">Fotografie a záznamy se ukládají do úložiště tohoto prohlížeče v zařízení. Neodesílají se na náš server, protože žádný server tato verze nepoužívá. Pokud vymažeš data webu nebo změníš prohlížeč, mohou se záznamy ztratit. Pravidelně si data exportuj, až tuto funkci doplníme.</p>${button('Smazat všechna data','clearconfirm','btn ghost')}</div>`}
let filterCat='Vše',occasion='Do práce',suggestions=[];
function render(){const v=$('#view');v.innerHTML=({home:renderHome,wardrobe:renderWardrobe,stylist:renderStylist,favorites:renderFavorites,profile:renderProfile}[currentTab])();if(currentTab==='profile'){$('#style').value=profile?.style||'Romantický a přirozený';if($('#profilefile'))$('#profilefile').addEventListener('change',profileFile)}}
function openModal(content){$('#modalroot').innerHTML=`<div class="modal-back" data-action="closemodal"><div class="modal" onclick="event.stopPropagation()">${content}</div></div>`}
function addForm(item){editingItem=item||null;openModal(`<div class="close-row"><h2>${item?'Upravit kousek':'Přidat do šatníku'}</h2><button class="btn ghost small" data-action="closemodal">Zavřít</button></div><form id="itemform"><div class="field"><label>Fotografie oblečení ${item?'(ponech prázdné, pokud ji nechceš změnit)':'*'}</label><input id="itemfile" type="file" accept="image/*" capture="environment" ${item?'':'required'}></div><div id="imgstatus" class="status"></div><div class="field"><label>Název *</label><input id="itemname" required maxlength="60" placeholder="Např. olivový kardigan" value="${esc(item?.name||'')}"></div><div class="row"><div class="field"><label>Kategorie</label><select id="itemcat">${['Vrchní díly','Kalhoty a sukně','Šaty','Boty','Doplňky','Svrchní oblečení'].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Barva</label><input id="itemcolor" placeholder="Např. olivová" value="${esc(item?.color||'')}"></div></div><div class="field"><label>Poznámka (volitelné)</label><input id="itemnote" placeholder="Např. do práce, teplý materiál" value="${esc(item?.note||'')}"></div><button class="btn" type="submit" style="width:100%">Uložit kousek</button></form><p class="notice">Fotografie se uloží do tohoto zařízení. Pro první verzi doplň název a kategorii ručně.</p>`);$('#itemform').addEventListener('submit',saveItem)}
async function saveItem(e){e.preventDefault();const file=$('#itemfile').files[0];let blob=editingItem?.image;if(file)blob=await compressImage(file);if(!blob){alert('Vyber fotografii.');return}const obj={id:editingItem?.id||uid(),type:'item',image:blob,name:$('#itemname').value.trim(),category:$('#itemcat').value,color:$('#itemcolor').value.trim(),note:$('#itemnote').value.trim(),favorite:editingItem?.favorite||false};await put(obj);await refresh();$('#modalroot').innerHTML='';render()}
function compressImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('image'))},'image/jpeg',.82)};im.onerror=reject;im.src=url})}
async function profileFile(e){const f=e.target.files[0];if(!f)return;const image=await compressImage(f);profile={...(profile||{}),type:'profile',id:'profile',image};await put(profile);await refresh();render()}
async function saveProfile(){profile={...(profile||{}),id:'profile',type:'profile',style:$('#style').value};await put(profile);await refresh();alert('Preference uložené.');render()}
function generate(){const chosen=selectedItems.length?wardrobe.filter(i=>selectedItems.includes(i.id)):wardrobe;if(!chosen.length){alert('Nejdřív přidej do šatníku alespoň dva kousky.');return}const catOrder=['Svrchní oblečení','Vrchní díly','Šaty','Kalhoty a sukně','Boty','Doplňky'];let base=chosen.slice().sort((a,b)=>catOrder.indexOf(a.category)-catOrder.indexOf(b.category));let combos=[];for(let shift=0;shift<Math.min(3,Math.max(1,base.length));shift++){let items=[];const bycat={};base.forEach(i=>(bycat[i.category]??=[]).push(i));const keys=Object.keys(bycat);const dress=bycat['Šaty']?.[shift%bycat['Šaty'].length];if(dress)items.push(dress);else {for(const c of ['Vrchní díly','Kalhoty a sukně'])if(bycat[c]?.length)items.push(bycat[c][shift%bycat[c].length]);}for(const c of ['Svrchní oblečení','Boty','Doplňky'])if(bycat[c]?.length)items.push(bycat[c][shift%bycat[c].length]);if(items.length<2)items=base.slice(shift,shift+3).concat(base.slice(0,Math.max(0,2-(base.slice(shift,shift+3).length))));items=[...new Map(items.map(i=>[i.id,i])).values()];if(items.length)combos.push({items,reason:`Návrh pro: ${occasion.toLowerCase()}. Zkus sladit tóny a přizpůsobit vrstvy počasí. Ověř, že se jednotlivé kousky hodí k sobě i pohodlím.`})}suggestions=combos;render();$('#suggestions')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function saveOutfit(n){const s=suggestions[n];if(!s)return;const outfit={id:uid(),type:'outfit',title:`${occasion} · ${new Date().toLocaleDateString('cs-CZ')}`,itemIds:s.items.map(i=>i.id),favorite:false,created:Date.now()};await put(outfit);await refresh();alert('Outfit uložený do tvých kombinací.');render()}
function viewOutfit(id){const o=outfits.find(x=>x.id===id);if(!o)return;const items=o.itemIds.map(itemById).filter(Boolean);openModal(`<div class="close-row"><h2>${esc(o.title)}</h2><button class="btn ghost small" data-action="closemodal">Zavřít</button></div><div class="outfit-look">${items.map(i=>`<div><img src="${imgURL(i.image)}" alt="${esc(i.name)}"><small>${esc(i.name)}</small></div>`).join('')}</div><p class="sub">Tato verze zobrazuje jednotlivé kousky vedle sebe. Realistické AI převlečení zatím není součástí této offline verze.</p><div class="row">${button(o.favorite?'Odebrat z oblíbených':'Přidat do oblíbených','toggleoutfit:'+o.id,'btn')}${button('Smazat outfit','deleteoutfit:'+o.id,'btn ghost')}</div>`)}
function shopping(n){const s=suggestions[n];if(!s)return;const cats=new Set(s.items.map(i=>i.category));const missing=[];if(!cats.has('Boty'))missing.push('Boty, které ladí s barvami outfitu');if(!cats.has('Doplňky'))missing.push('Jemný doplněk nebo kabelka');if(!cats.has('Svrchní oblečení'))missing.push('Kardigan nebo kabát pro vrstvení');openModal(`<div class="close-row"><h2>Co by šlo dokoupit?</h2><button class="btn ghost small" data-action="closemodal">Zavřít</button></div><p class="sub">Není nutné nic kupovat. Tady jsou nápady na typy kousků, které by mohly outfit doplnit.</p><ul>${(missing.length?missing:['Další kousek v krémové, okrové nebo olivové barvě pro novou variantu.']).map(x=>`<li style="margin:10px 0">${esc(x)}</li>`).join('')}</ul><p class="notice">Konkrétní produkty ani aktuální ceny tato verze nevyhledává, aby zůstala zdarma a bez reklam.</p>`)}
async function refresh(){const all=await getAll();wardrobe=all.filter(x=>x.type==='item');outfits=all.filter(x=>x.type==='outfit');profile=all.find(x=>x.type==='profile')||null}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('goto:'))return nav(a.split(':')[1]);if(a==='add')return addForm();if(a.startsWith('edit:'))return addForm(itemById(a.slice(5)));if(a==='closemodal')return $('#modalroot').innerHTML='';if(a.startsWith('filter:')){filterCat=a.slice(7);return render()}if(a.startsWith('occasion:')){occasion=a.slice(9);return render()}if(a.startsWith('pick:')){const id=a.slice(5);selectedItems.includes(id)?selectedItems=selectedItems.filter(x=>x!==id):selectedItems.push(id);return render()}if(a==='generate')return generate();if(a.startsWith('saveoutfit:'))return saveOutfit(Number(a.split(':')[1]));if(a.startsWith('shopping:'))return shopping(Number(a.split(':')[1]));if(a.startsWith('viewoutfit:'))return viewOutfit(a.slice(10));if(a.startsWith('favitem:')){const i=itemById(a.slice(8));if(i){i.favorite=!i.favorite;await put(i);await refresh();render()}return}if(a.startsWith('toggleoutfit:')){const o=outfits.find(x=>x.id===a.slice(13));if(o){o.favorite=!o.favorite;await put(o);await refresh();viewOutfit(o.id)}return}if(a.startsWith('unfav:')){const o=outfits.find(x=>x.id===a.slice(6));if(o){o.favorite=false;await put(o);await refresh();render()}return}if(a.startsWith('deleteoutfit:')){if(confirm('Opravdu smazat tento outfit?')){await del(a.slice(13));await refresh();$('#modalroot').innerHTML='';render()}return}if(a==='saveprofile')return saveProfile();if(a==='clearconfirm'){openModal(`<h2>Smazat všechna data?</h2><p class="sub">Tímto smažeš uložené oblečení, outfity i profilovou fotografii z tohoto prohlížeče.</p><div class="row">${button('Zrušit','closemodal','btn secondary')}${button('Ano, smazat vše','clearall','btn')}</div>`);return}if(a==='clearall'){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=async()=>{await refresh();profile=null;wardrobe=[];outfits=[];$('#modalroot').innerHTML='';nav('home')};return}});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.tab)));
(async()=>{try{db=await openDB();await refresh();render()}catch(e){$('#view').innerHTML='<div class="card">Prohlížeč nepovolil místní úložiště. Otevři aplikaci v Safari nebo jiném moderním prohlížeči.</div>'}})();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
